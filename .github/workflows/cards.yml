name: Profile cards

# Redraws cards/stats.svg, cards/languages.svg and cards/streak.svg from the GitHub API with
# scripts/cards.py, once a day and on demand. No third-party service or action.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Draw the cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cards.py
      - name: Commit them if they changed
        run: |
          git diff --quiet -- cards && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          git commit -m "Redraw the profile cards."
          git push
